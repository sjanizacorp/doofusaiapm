apiVersion: v1
kind: Service
metadata:
  name: doofusai-spm-peer
  labels:
    app.kubernetes.io/name: doofusai-spm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: doofusai-spm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: doofusai-spm
  labels:
    app.kubernetes.io/name: doofusai-spm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: doofusai-spm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doofusai-spm
  labels:
    app.kubernetes.io/name: doofusai-spm
spec:
  serviceName: doofusai-spm-peer
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doofusai-spm
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doofusai-spm
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spm
          image: doofusai-spm:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SPM_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            exec:
              command: [python3, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            exec:
              command: [python3, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
            timeoutSeconds: 3
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: configuration
              mountPath: /etc/doofusai
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: configuration
          secret:
            secretName: doofusai-spm-config
            optional: true
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOncePod]
        volumeMode: Filesystem
        resources:
          requests:
            storage: 10Gi
